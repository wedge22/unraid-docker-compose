version: "3.9"
services:
  web:
    image: nginx
    container_name: nginx
    #volumes:
    #- /mnt/user/appdata/nginx:/app/data
    environment:
     - NGINX_HOST=${NGINX_DOMAIN}
     - NGINX_PORT=80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.entrypoints=http"
      - "traefik.http.routers.nginx.rule=Host(`${NGINX_DOMAIN}`)"
      - "traefik.http.middlewares.nginx-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.nginx.middlewares=nginx-https-redirect"
      - "traefik.http.routers.nginx-secure.entrypoints=https"
      - "traefik.http.routers.nginx-secure.rule=Host(`${NGINX_DOMAIN}`)"
      - "traefik.http.routers.nginx-secure.tls=true"
      - "traefik.http.routers.nginx-secure.service=nginx"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx-secure.middlewares=authelia@docker"
      - "traefik.docker.network=proxy"
    networks:
      jarvis:
    security_opt:
      - no-new-privileges:true

networks:
  jarvis:
    external: true